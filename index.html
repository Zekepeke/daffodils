<!-- Chopped css added to my html lol -->
<style>

  .curved-m {
      position: center;
      animation: popUpFadeAway 3s forwards; /* The animation */
  }

  .curved-m {
      font-size: 48px;
      color: #ff80ed;
      font-family: 'Brush Script MT', cursive;
      left: 0px;
      text-align: center;
      white-space: nowrap;
      padding: 0 20px;
  }

  @keyframes popUpFadeAway {
      0% {
          transform: rotate(0deg), scale(0);
          opacity: 0;
      }
      50% {
        transform: rotate(0deg), scale(1);
          opacity: 1;
      }
      100% {
        transform: rotate(0deg), scale(0);
          opacity: 0;
      }
  }
</style>

    
<body class="not-loaded">
    <div class="night"></div>
    <div class="opener-hearts" aria-hidden="true"></div>
    


    <div class="sky"></div>
    <div class="bouquet" role="img" aria-label="A bouquet of pale daffodils swaying in the dark"></div>

</body>
